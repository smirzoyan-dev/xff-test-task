events {}

http {
    server {
        listen 80;

        location / {
            proxy_set_header X-Forwarded-For "$remote_addr, $server_addr";
            proxy_pass http://app:5000/;
        }

        location = /internal {
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $server_addr";
            proxy_pass http://app:5000/;
        }
    }
}
