services:
  app:
    build: ./app
    networks:
      - backend

  nginx3:
    image: nginx:1.30.2-alpine
    ports:
      - "8083:80"
    volumes:
      - ./nginx3/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - backend

  nginx2:
    image: nginx:1.30.2-alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx2/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nginx3
    networks:
      - backend

  nginx1:
    image: nginx:1.30.2-alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx1/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nginx2
    networks:
      - backend

networks:
  backend:
